services:
  mysql:
    image: mysql:8.0
    container_name: med_mysql
    environment:
      MYSQL_ROOT_PASSWORD: medrag123
      MYSQL_DATABASE: med_rag
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmedrag123"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: med_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd --advertise-client-urls=http://127.0.0.1:2379 --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    container_name: med_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: med_milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio

  backend:
    build:
      context: ./backend
    container_name: med_backend
    env_file:
      - ./backend/.env
    environment:
      MYSQL_HOST: mysql
      MILVUS_HOST: milvus
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: med_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
